# Vérifie que le site se construit sans erreur à chaque envoi de code (aucune mise en ligne).
name: Vérifier la construction
on:
  push:
  pull_request:
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

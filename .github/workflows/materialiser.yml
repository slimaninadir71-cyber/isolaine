# Récupère une fois le code source complet d'Iso-Laine (stocké dans Supabase) et l'enregistre dans ce dépôt.
name: Récupérer le code source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/materialiser.yml']
permissions:
  contents: write
jobs:
  recuperer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Télécharger et vérifier les fichiers (empreintes SHA-1)
        run: node scripts/bootstrap.mjs
      - name: Enregistrer le code dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib public scripts
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Code source d'Iso-Laine récupéré depuis Supabase (fichiers vérifiés)"
          git push
